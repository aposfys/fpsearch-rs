[package]
name = "fpsearch"
version = "0.1.0"
edition = "2021"
rust-version = "1.75"
description = "Fast Tanimoto similarity search over large binary fingerprint collections"
authors = ["Apostolos Fysekidis"]
license = "MIT"
repository = "https://github.com/aposfys/fpsearch-rs"
keywords = ["cheminformatics", "similarity", "tanimoto", "fingerprint", "search"]
categories = ["science", "algorithms"]
readme = "README.md"

[lib]
name = "fpsearch"
crate-type = ["rlib", "cdylib"]

[dependencies]
memmap2 = "0.9"

[dev-dependencies]
criterion = "0.5"

[[bench]]
name = "tanimoto"
harness = false

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
